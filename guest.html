<!doctype html>
<html lang="ru"><head><meta name="robots" content="noindex, nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ваше видео с заезда</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#151713;color:#f5f6eb;font:16px/1.55 system-ui,sans-serif}main{width:min(780px,calc(100% - 32px));margin:32px auto}a{color:#dcfa69;text-underline-offset:4px}h1{font-size:clamp(2.2rem,7vw,4.5rem);letter-spacing:-.065em;line-height:1;margin:12px 0}header p{color:#c5c9b8}.frame{aspect-ratio:16/9;border-radius:12px;border:1px solid #4b5433;display:grid;place-items:center;background:#23291a;text-align:center;overflow:hidden}.frame video{width:100%;height:100%;object-fit:contain;background:#10120e}.frame [hidden]{display:none}.empty{padding:20px}.download{display:inline-block;margin-top:16px;padding:12px 18px;background:#dcfa69;color:#151710;font-weight:700;border-radius:4px;text-decoration:none}.download[hidden]{display:none}:focus-visible{outline:2px solid #dcfa69;outline-offset:4px}
.demo-banner{font-size:.94rem;border-left:3px solid #dcfa69;padding:10px 14px;margin:20px 0;color:#e5ecd4;background:#242d1c}.frame video{aspect-ratio:16/9}.help{color:#c5c9b8}.status{color:#dce5c7}
</style></head><body>
<main><a href="index.html#demo">← Вернуться на сайт</a><header><p>Демо страницы гостя · Команда площадки</p><h1>Ваше видео с заезда</h1><p>Здесь можно посмотреть и сохранить ролик.</p></header><p class="demo-banner">Это демонстрация интерфейса. Видео иллюстративное, не съёмка с площадки.</p><div class="frame"><div class="empty" id="placeholder" role="status" hidden>Не получилось открыть демо. Попробуйте обновить страницу.</div><video id="guest-video" src="demo.mp4" poster="demo-poster.png" controls playsinline preload="metadata" aria-label="Тестовое видео с заезда"></video></div><a class="download" id="download" href="demo.mp4" download="demo-360.mp4">Скачать демо ↓</a><p class="help">MP4 · 8 секунд · без звука</p><noscript><p class="status">Для просмотра используйте встроенный плеер или скачайте MP4.</p></noscript></main>
<script>
const video=document.querySelector('#guest-video');
const placeholder=document.querySelector('#placeholder');
const download=document.querySelector('#download');
video.addEventListener('loadedmetadata',()=>{video.hidden=false;placeholder.hidden=true;download.hidden=false;});
video.addEventListener('error',()=>{video.hidden=true;placeholder.hidden=false;download.hidden=true;});
</script></body></html>
